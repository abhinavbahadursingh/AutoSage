<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b10" />
    <meta name="description" content="AutoSage — Verified Multi-Agent AutoML. Transform natural language ML tasks into reproducible, empirically verified pipelines." />

    <!-- Inter font (UI + body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>AutoSage — Verified Multi-Agent AutoML</title>

    <!-- Inline theme init — runs synchronously before paint to avoid flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('as-theme');
          var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.className = stored || preferred;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Noise SVG filter — referenced via CSS filter:url(#noise) -->
    <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
      <defs>
        <filter id="as-noise" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" stitchTiles="stitch" result="noiseOut"/>
          <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
          <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
          <feComposite in="blended" in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
