[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autosage-backend"
version = "0.1.0"
description = "AutoSage: A Verified Multi-Agent System for Natural-Language-Driven Automated Machine Learning"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "AutoSage Research Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "docker>=7.0.0",
    "mlflow>=2.11.3",
    "httpx>=0.27.0",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "httpx>=0.27.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
