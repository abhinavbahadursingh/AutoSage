# AutoSage Alembic configuration (Phase 1).
# The database URL is injected at runtime from settings (see alembic/env.py),
# so this file carries no secrets.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
version_locations = %(here)s/alembic/versions

# Placeholder — env.py overrides sqlalchemy.url from app settings.
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/autosage

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
